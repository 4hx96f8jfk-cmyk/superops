name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: |
          uv venv
          uv pip install -e packages/effect-ledger -e packages/modelhub \
            -e packages/ops-console -e packages/superops-cli
          uv pip install pytest
      - name: Run tests
        run: .venv/bin/pytest -q

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leak scan
        run: python tools/leak-scan.py

  build:
    runs-on: ubuntu-latest
    needs: [test, leak-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheels
        run: |
          for p in effect-ledger modelhub ops-console superops-cli; do
            uv build "packages/$p" --out-dir dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/

  # PyPI 发布：仅打 tag 时触发，需仓库 secret PYPI_TOKEN（未配置时该 job 跳过，不影响 CI 绿）。
  publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        if: ${{ secrets.PYPI_TOKEN != '' }}
        run: uv publish --token "$PYPI_TOKEN" dist/*
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
