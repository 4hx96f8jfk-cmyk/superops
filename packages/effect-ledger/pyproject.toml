[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hongyun-effect-ledger"
version = "0.1.0"
description = "A durable effect ledger for AI agents — prove what actually executed, block blind replays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HongYun", email = "hongyun@hongyun.dev" }]
keywords = ["ai-agent", "idempotency", "side-effects", "durable-execution", "reliability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["effect_ledger*"]
