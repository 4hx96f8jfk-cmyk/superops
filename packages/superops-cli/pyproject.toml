[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superops-cli"
version = "0.1.0"
description = "HongYun SuperOps — 一键安装体验 CLI（superops init/status/doctor/serve）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HongYun", email = "hongyun@hongyun.dev" }]
keywords = ["ai-agent", "ops", "cli", "side-effects", "reliability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "click>=8.1",
  "hongyun-effect-ledger>=0.1.0",
]

[project.optional-dependencies]
console = ["superops-console", "uvicorn>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
superops = "superops_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
